{% load static %}
<header class="h-12 bg-gray-800 text-white sticky top-0 z-50 border-b border-gray-700">
    <div class="h-full flex items-center justify-between px-4">
        <!-- Left section - Logo/Brand -->
        <div class="flex items-center space-x-4">
            <a class="flex items-center space-x-2 hover:text-gray-300 transition-colors" href="/">
                <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M2 5a2 2 0 012-2h7a2 2 0 012 2v4a2 2 0 01-2 2H9l-3 3v-3H4a2 2 0 01-2-2V5z"/>
                        <path d="M15 7v2a4 4 0 01-4 4H9.828l-1.766 1.767c.28.149.599.233.938.233h2l3 3v-3h2a2 2 0 002-2V9a2 2 0 00-2-2h-1z"/>
                    </svg>
                </div>
                <span class="font-semibold text-sm">Meow Chat</span>
            </a>
            
            <div id="online-user-count" class="text-xs text-gray-400"></div>
        </div>

        <!-- Center section - Search bar -->
        <div class="flex-1 max-w-md mx-4">
            <div class="relative">
                <input type="text" placeholder="Search" 
                       class="w-full bg-gray-900 text-sm text-white placeholder-gray-400 border border-gray-600 rounded px-3 py-1 focus:outline-none focus:border-indigo-500">
                <svg class="absolute right-2 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
                </svg>
            </div>
        </div>

        <!-- Right section - User actions -->
        <nav class="flex items-center space-x-2">
            {% if request.user.is_authenticated %}
            
            <!-- Notifications -->
            <button class="p-2 text-gray-400 hover:text-white hover:bg-gray-700 rounded transition-colors" title="Notifications">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/>
                </svg>
            </button>

            <!-- Chats Dropdown -->
            <div x-data="{ dropdownOpen: false }" class="relative">
                <button @click="dropdownOpen = !dropdownOpen" @click.away="dropdownOpen = false" 
                        class="flex items-center space-x-1 px-3 py-2 text-gray-300 hover:text-white hover:bg-gray-700 rounded transition-colors">
                    <div id="online-in-chats"></div>
                    <span class="text-sm font-medium">Chats</span>
                    <svg x-bind:class="dropdownOpen && 'rotate-180'" class="w-4 h-4 transition-transform" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                    </svg>
                </button>
                
                <div x-show="dropdownOpen" x-cloak 
                     class="absolute right-0 mt-1 w-64 bg-gray-800 border border-gray-700 rounded-lg shadow-xl z-50"
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="opacity-0 scale-95"
                     x-transition:enter-end="opacity-100 scale-100">
                    <div class="p-2">
                        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wide px-2 pb-2">Active Chats</div>
                        <ul id="chats-list" class="space-y-1">
                            <!-- Dynamic chat list will be populated here -->
                        </ul>
                        <div class="border-t border-gray-700 mt-2 pt-2">
                            <a href="{% url 'new-groupchat' %}" class="flex items-center space-x-2 px-2 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700 rounded">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
                                </svg>
                                <span>Create Chat</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- User Menu -->
            <div x-data="{ dropdownOpen: false }" class="relative">
                <button @click="dropdownOpen = !dropdownOpen" @click.away="dropdownOpen = false" 
                        class="flex items-center space-x-2 px-2 py-1 hover:bg-gray-700 rounded transition-colors">
                    <div class="relative">
                        <img class="w-8 h-8 rounded-full object-cover" src="{{ request.user.profile.avatar }}" alt="Avatar" />
                        <div class="absolute -bottom-1 -right-1 w-3 h-3 bg-green-500 border-2 border-gray-800 rounded-full"></div>
                    </div>
                    <div class="hidden sm:block text-left">
                        <div class="text-sm font-medium text-white">{{ request.user.profile.name }}</div>
                        <div class="text-xs text-gray-400">{{ request.user.username }}</div>
                    </div>
                    <svg x-bind:class="dropdownOpen && 'rotate-180'" class="w-4 h-4 text-gray-400 transition-transform" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                    </svg>
                </button>
                
                <div x-show="dropdownOpen" x-cloak 
                     class="absolute right-0 mt-1 w-48 bg-gray-800 border border-gray-700 rounded-lg shadow-xl z-50"
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="opacity-0 scale-95"
                     x-transition:enter-end="opacity-100 scale-100">
                    <div class="py-1">
                        <a href="{% url 'profile' %}" class="flex items-center space-x-2 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                            </svg>
                            <span>My Profile</span>
                        </a>
                        <a href="{% url 'profile-edit' %}" class="flex items-center space-x-2 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
                            </svg>
                            <span>Edit Profile</span>
                        </a>
                        <a href="{% url 'profile-settings' %}" class="flex items-center space-x-2 px-3 py-2 text-sm text-gray-300 hover:text-white hover:bg-gray-700">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
                            </svg>
                            <span>Settings</span>
                        </a>
                        <div class="border-t border-gray-700 my-1"></div>
                        <a href="{% url 'account_logout' %}" class="flex items-center space-x-2 px-3 py-2 text-sm text-red-400 hover:text-red-300 hover:bg-gray-700">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/>
                            </svg>
                            <span>Log Out</span>
                        </a>
                    </div>
                </div>
            </div>
            </li>
            
            {% else %}
            <li><a href="{% url 'account_login' %}">Login</a></li>
            <li><a href="{% url 'account_signup' %}?next={% url 'profile-onboarding' %}">Signup</a></li>
            {% endif %}
        </ul>
    </nav>
</header>
