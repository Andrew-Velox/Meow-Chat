{% load static %}
<div class="h-12 bg-gradient-to-r from-gray-800 via-gray-900 to-gray-800 text-white border-b border-gray-700 shadow-lg">
    <div class="h-full flex items-center justify-between px-4">
        <!-- Left section - Logo/Brand with glow effect -->
        <div class="flex items-center space-x-4">
            <a class="flex items-center space-x-2 no-underline hover:no-underline text-white group" href="/">
                <div class="w-8 h-8  rounded-full flex items-center justify-center transition-all duration-300 group-hover:scale-110">
                    <img src="{% static 'bigicn.png' %}" alt="Logo" class="w-6 h-6">
                </div>
                <span class="font-bold text-base  from-indigo-400 to-purple-400 bg-clip-text   transition-all ">Meow-Chat</span>
            </a>
            
            <div id="online-user-count" class="flex items-center space-x-1 text-xs">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-gray-400 font-medium"></span>
            </div>
        </div>

        <!-- Center section - Enhanced Search bar -->
        <div class="flex-1 max-w-md mx-4 min-w-0">
            <div class="relative group">
                <input type="text" placeholder="Search conversations, users..." 
                       class="w-full bg-gray-900/50 backdrop-blur-sm text-sm text-white placeholder-gray-500 border border-gray-700 rounded-lg px-4 py-1.5 pl-10 focus:outline-none focus:border-indigo-500 focus:bg-gray-900 transition-all duration-300 focus:shadow-lg focus:shadow-indigo-500/20">
                <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-500 group-focus-within:text-indigo-400 transition-colors" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
                </svg>
            </div>
        </div>

        <!-- Right section - User actions with enhanced buttons -->
        <nav class="flex items-center space-x-1">
            {% if request.user.is_authenticated %}
            
            <!-- Notifications with badge -->
            <button class="relative p-2 text-gray-400 hover:text-white hover:bg-gray-700/50 rounded-lg transition-all duration-200 hover:scale-105" title="Notifications">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/>
                </svg>
                <!-- Notification badge -->
                <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border border-gray-800"></span>
            </button>

            <!-- User Menu with smooth animations -->
            <div x-data="{ dropdownOpen: false }" class="relative">
                <button @click="dropdownOpen = !dropdownOpen" @click.away="dropdownOpen = false" 
                        class="flex items-center space-x-2 px-2 py-1 hover:bg-gray-700/50 rounded-lg transition-all duration-200">
                    <div class="relative">
                        <img class="w-8 h-8 rounded-full object-cover ring-2 ring-gray-700 hover:ring-indigo-500 transition-all duration-300" src="{{ request.user.profile.avatar }}" alt="Avatar" />
                        <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-green-500 border-2 border-gray-800 rounded-full shadow-lg"></div>
                    </div>
                    <div class="hidden sm:block text-left min-w-0 max-w-32">
                        <div class="text-sm font-semibold text-white truncate">{{ request.user.profile.name }}</div>
                        <div class="text-xs text-gray-400 truncate">@{{ request.user.username }}</div>
                    </div>
                    <svg x-bind:class="dropdownOpen && 'rotate-180'" class="w-4 h-4 text-gray-400 transition-transform duration-300" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                    </svg>
                </button>
                
                <div x-show="dropdownOpen" x-cloak 
                     class="absolute right-0 mt-2 w-56 bg-gray-800 border border-gray-700 rounded-xl shadow-2xl z-50 overflow-hidden"
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                     x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                     x-transition:leave="transition ease-in duration-150"
                     x-transition:leave-start="opacity-100 scale-100"
                     x-transition:leave-end="opacity-0 scale-95">
                    
                    <!-- User info header -->
                    <div class="px-4 py-3 bg-gradient-to-r from-indigo-600/20 to-purple-600/20 border-b border-gray-700">
                        <div class="flex items-center space-x-3">
                            <img class="w-10 h-10 rounded-full ring-2 ring-indigo-500/50" src="{{ request.user.profile.avatar }}" alt="Avatar" />
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-semibold text-white truncate">{{ request.user.profile.name }}</div>
                                <div class="text-xs text-gray-400 truncate">@{{ request.user.username }}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="py-1">
                        <a href="{% url 'profile' %}" class="flex items-center space-x-3 px-4 py-2.5 text-sm text-gray-300 hover:text-white hover:bg-gray-700/50 transition-all duration-200 group">
                            <svg class="w-5 h-5 text-gray-400 group-hover:text-indigo-400 transition-colors" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                            </svg>
                            <span class="font-medium">My Profile</span>
                        </a>
                        <a href="{% url 'profile-edit' %}" class="flex items-center space-x-3 px-4 py-2.5 text-sm text-gray-300 hover:text-white hover:bg-gray-700/50 transition-all duration-200 group">
                            <svg class="w-5 h-5 text-gray-400 group-hover:text-blue-400 transition-colors" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
                            </svg>
                            <span class="font-medium">Edit Profile</span>
                        </a>
                        <a href="{% url 'profile-settings' %}" class="flex items-center space-x-3 px-4 py-2.5 text-sm text-gray-300 hover:text-white hover:bg-gray-700/50 transition-all duration-200 group">
                            <svg class="w-5 h-5 text-gray-400 group-hover:text-purple-400 transition-colors" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
                            </svg>
                            <span class="font-medium">Settings</span>
                        </a>
                        <div class="border-t border-gray-700 my-1"></div>
                        <a href="{% url 'account_logout' %}" class="flex items-center space-x-3 px-4 py-2.5 text-sm text-red-400 hover:text-red-300 hover:bg-red-500/10 transition-all duration-200 group">
                            <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/>
                            </svg>
                            <span class="font-semibold">Log Out</span>
                        </a>
                    </div>
                </div>
            </div>
            
            {% else %}
            <!-- Login/Signup buttons for unauthenticated users -->
            <a href="{% url 'account_login' %}" class="px-4 py-1.5 text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700/50 rounded-lg transition-all duration-200">
                Login
            </a>
            <a href="{% url 'account_signup' %}?next={% url 'profile-onboarding' %}" class="px-4 py-1.5 text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 rounded-lg transition-all duration-200 shadow-lg hover:shadow-indigo-500/50 hover:scale-105">
                Sign Up
            </a>
            {% endif %}
        </nav>
    </div>
</div>
