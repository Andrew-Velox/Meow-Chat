<!-- Discord-style Server/Chat Sidebar -->
{% load static %}
<div class="w-16 flex-shrink-0 discord-sidebar flex flex-col items-center py-3 space-y-3">
    <!-- Home/Direct Messages Button -->
    <a href="/" class="discord-server-icon bg-indigo-500 hover:bg-indigo-600 group relative" title="Home">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
        </svg>
        <!-- Tooltip -->
        <div class="absolute left-16 top-1/2 transform -translate-y-1/2 bg-black text-white text-xs rounded py-1 px-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
            Home
        </div>
    </a>
    
    <!-- Travel Assistant Chat Button -->
    <a href="{% url 'travel-chat' %}" class="discord-server-icon bg-transparent hover:bg-gray-600 p-0 overflow-hidden group relative border-2 border-purple-500 hover:border-purple-400" title="Travel Assistant">
        <img src="{% static 'images/travel_ai.gif' %}" alt="Travel Assistant" class="w-12 h-12 object-cover">
        <!-- Tooltip -->
        <div class="absolute left-16 top-1/2 transform -translate-y-1/2 bg-black text-white text-xs rounded py-1 px-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
            Travel Assistant 🤖
        </div>
    </a>
    <!-- Helping Assistant Chat Button -->
    <a href="{% url 'helper-chat' %}" class="discord-server-icon bg-transparent hover:bg-gray-600 p-0 overflow-hidden group relative border-2 border-blue-500 hover:border-blue-400" title="Helping Assistant">
        <img src="{% static 'images/ai_assistant.gif' %}" alt="Helping Assistant" class="w-12 h-12 object-cover">
        <!-- Tooltip -->
        <div class="absolute left-16 top-1/2 transform -translate-y-1/2 bg-black text-white text-xs rounded py-1 px-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
            Helping Assistant 🤖
        </div>
    </a>
    
    <!-- AI GF Chat Button -->
    <a href="{% url 'ai-chat' %}" class="discord-server-icon bg-transparent hover:bg-gray-600 p-0 overflow-hidden group relative border-2 border-pink-500 hover:border-pink-400" title="AI GF">
        <img src="{% static 'images/ai_gf.gif' %}" alt="AI GF" class="w-12 h-12 object-cover">
        <!-- Tooltip -->
        <div class="absolute left-16 top-1/2 transform -translate-y-1/2 bg-black text-white text-xs rounded py-1 px-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
            AI GF 💕
        </div>
    </a>
    
    
    
    <!-- Separator -->
    <div class="w-8 h-0.5 bg-gray-600 rounded"></div>
    
    <!-- Dynamic Chat List -->
    <div id="sidebar-chats" class="flex flex-col space-y-3">
        <!-- User's Group Chats will be populated here -->
    </div>
    
    <!-- Add Server/Chat Button -->
    <a href="{% url 'new-groupchat' %}" class="discord-server-icon bg-gray-700 hover:bg-green-600 group relative" title="Create Chat">
        <svg class="w-6 h-6 group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
        </svg>
        <!-- Tooltip -->
        <div class="absolute left-16 top-1/2 transform -translate-y-1/2 bg-black text-white text-xs rounded py-1 px-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
            Create Chat
        </div>
    </a>
</div>

<script>
// Function to load and display user's chats in the sidebar
async function loadSidebarChats() {
    try {
        const response = await fetch('/api/user-chats/');
        const chats = await response.json();
        
        const sidebarChats = document.getElementById('sidebar-chats');
        sidebarChats.innerHTML = '';
        
        chats.forEach(chat => {
            const chatElement = document.createElement('a');
            chatElement.href = `/chat/room/${chat.group_name}`;
            chatElement.className = 'discord-server-icon group relative';
            
            // Determine display name and title based on chat type
            let displayName, tooltipName, initials, contentHTML;
            
            if (chat.is_private && chat.other_user_name) {
                // For private chats, use the other user's name
                displayName = chat.other_user_name;
                tooltipName = chat.other_user_name;
                initials = chat.other_user_name.substring(0, 2).toUpperCase();
                
                // Use profile image if available, otherwise use initials
                if (chat.other_user_avatar) {
                    contentHTML = `<img src="${chat.other_user_avatar}" class="w-12 h-12 rounded-full object-cover" alt="${chat.other_user_name}">`;
                    chatElement.className += ' bg-transparent hover:bg-gray-600 p-0 overflow-hidden';
                } else {
                    contentHTML = `<span class="text-sm font-bold">${initials}</span>`;
                    chatElement.className += ' bg-purple-600 hover:bg-purple-700';
                }
            } else if (chat.groupchat_name) {
                // For group chats, use the group chat name
                displayName = chat.groupchat_name;
                tooltipName = chat.groupchat_name;
                initials = chat.groupchat_name.substring(0, 2).toUpperCase();
                
                // Use group banner if available, otherwise use initials
                if (chat.banner_url) {
                    contentHTML = `<img src="${chat.banner_url}" class="w-12 h-12 rounded-full object-cover" alt="${chat.groupchat_name}">`;
                    chatElement.className += ' bg-transparent hover:bg-gray-600 p-0 overflow-hidden';
                } else {
                    contentHTML = `<span class="text-sm font-bold">${initials}</span>`;
                    chatElement.className += ' bg-blue-600 hover:bg-blue-700';
                }
            } else {
                // Fallback to group name
                displayName = chat.group_name;
                tooltipName = chat.group_name;
                initials = chat.group_name.substring(0, 2).toUpperCase();
                contentHTML = `<span class="text-sm font-bold">${initials}</span>`;
                chatElement.className += ' bg-gray-600 hover:bg-gray-700';
            }
            
            chatElement.title = tooltipName;
            
            chatElement.innerHTML = `
                ${contentHTML}
                <div class="absolute left-16 top-1/2 transform -translate-y-1/2 bg-black text-white text-xs rounded py-1 px-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50">
                    ${tooltipName}
                </div>
            `;
            
            sidebarChats.appendChild(chatElement);
        });
    } catch (error) {
        console.log('Could not load sidebar chats:', error);
    }
}

// Load chats when page loads
document.addEventListener('DOMContentLoaded', loadSidebarChats);

// Reload chats when a new chat is created (you can trigger this from your forms)
window.reloadSidebarChats = loadSidebarChats;
</script>
